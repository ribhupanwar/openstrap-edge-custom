name: Build OpenStrap Edge Custom IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          unzip -q openstrap-edge-whoop-custom.zip
          cd edge-main
          echo "Project extracted"
          ls

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'

      - name: Build IPA
        working-directory: edge-main
        run: |
          echo "COMPANION_URL=" > .env
          echo "BACKEND_URL=" >> .env
          echo "ENABLE_HEALTH_DATA_CONTRIBUTION=true" >> .env

          flutter pub get

          flutter build ios \
            --release \
            --no-codesign \
            --dart-define-from-file=.env

      - name: Package IPA
        working-directory: edge-main
        run: |
          rm -rf Payload
          mkdir -p Payload

          cp -R build/ios/iphoneos/Runner.app Payload/Runner.app

          zip -qr -y \
            openstrap-edge-custom-unsigned.ipa \
            Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: openstrap-edge-custom-unsigned-ipa
          path: edge-main/openstrap-edge-custom-unsigned.ipa
