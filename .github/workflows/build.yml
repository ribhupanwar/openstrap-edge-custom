name: Build OpenStrap Edge Custom IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          unzip -q openstrap-edge-whoop-custom.zip
          echo "Project extracted"
          ls -la

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'

      - name: Install dependencies
        working-directory: edge-main
        run: |
          echo "COMPANION_URL=" > .env
          echo "BACKEND_URL=" >> .env
          echo "ENABLE_HEALTH_DATA_CONTRIBUTION=true" >> .env

          flutter pub get

      - name: Check Xcode
        run: |
          xcodebuild -version
          xcode-select -p

      # ---------------------------------------------------------
      # FIX CURRENT WHOOP UI / ALARM COMPILE ERRORS
      # ---------------------------------------------------------

      - name: Fix Dart compile errors
        working-directory: edge-main
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("lib/ui2/screens/home_screen.dart")

          if not p.exists():
              raise SystemExit("home_screen.dart not found")

          s = p.read_text()

          print("Patching home_screen.dart...")

          # ---------------------------------------------------
          # FIX 1
          # Nullable tuple destructuring
          # ---------------------------------------------------

          old = "final (armedAt, alarmState) = alarmArmOfContext(c);"

          new = """final alarmContext = alarmArmOfContext(c);
              final armedAt = alarmContext?.$1;
              final alarmState = alarmContext?.$2;"""

          if old in s:
              s = s.replace(old, new)
              print("FIX 1 applied")
          else:
              print("FIX 1 already applied / not required")

          # ---------------------------------------------------
          # FIX 2
          # AlarmScreen is not available in this screen.
          #
          # Remove the broken navigation target.
          # The alarm card remains visible but does not call
          # a non-existent Dart class.
          # ---------------------------------------------------

          old = "onTap: () => go(c, const AlarmScreen()),"

          if old in s:
              s = s.replace(
                  old,
                  "onTap: () {},"
              )
              print("FIX 2 applied")

          old = "onTap: () => go(c, AlarmScreen()),"

          if old in s:
              s = s.replace(
                  old,
                  "onTap: () {},"
              )
              print("FIX 2b applied")

          # ---------------------------------------------------
          # FIX 3
          # AlarmArmState.smart does not exist.
          # ---------------------------------------------------

          old = "alarmState == AlarmArmState.smart"

          if old in s:
              s = s.replace(
                  old,
                  "alarmState != null"
              )
              print("FIX 3 applied")

          p.write_text(s)

          print("Dart compile patch completed.")
          PY

      # ---------------------------------------------------------
      # DISABLE APPLE SIGNING
      # ---------------------------------------------------------

      - name: Disable iOS signing
        working-directory: edge-main
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("ios/Runner.xcodeproj/project.pbxproj")

          if p.exists():
              s = p.read_text()

              s = s.replace(
                  "CODE_SIGN_STYLE = Automatic;",
                  "CODE_SIGN_STYLE = Manual;"
              )

              s = s.replace(
                  "CODE_SIGNING_ALLOWED = YES;",
                  "CODE_SIGNING_ALLOWED = NO;"
              )

              s = s.replace(
                  "CODE_SIGNING_REQUIRED = YES;",
                  "CODE_SIGNING_REQUIRED = NO;"
              )

              s = s.replace(
                  'DEVELOPMENT_TEAM = "$(APPLE_DEVELOPMENT_TEAM)";',
                  'DEVELOPMENT_TEAM = "";'
              )

              s = s.replace(
                  'CODE_SIGN_IDENTITY = "Apple Development";',
                  'CODE_SIGN_IDENTITY = "";'
              )

              p.write_text(s)

              print("project.pbxproj patched")

          signing = Path("ios/Config/Signing.defaults.xcconfig")

          if signing.exists():
              ss = signing.read_text()

              if "CODE_SIGNING_ALLOWED = NO" not in ss:
                  ss += "\nCODE_SIGNING_ALLOWED = NO\n"

              if "CODE_SIGNING_REQUIRED = NO" not in ss:
                  ss += "CODE_SIGNING_REQUIRED = NO\n"

              signing.write_text(ss)

              print("Signing.defaults.xcconfig patched")

          print("Unsigned build configuration ready.")
          PY

      # ---------------------------------------------------------
      # GENERATE FLUTTER IOS CONFIGURATION
      # ---------------------------------------------------------

      - name: Prepare Flutter iOS
        working-directory: edge-main
        run: |
          flutter build ios \
            --release \
            --no-codesign \
            --config-only \
            --dart-define-from-file=.env

      # ---------------------------------------------------------
      # BUILD IOS
      # ---------------------------------------------------------

      - name: Build iOS without signing
        working-directory: edge-main
        run: |
          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/ios \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            build

      # ---------------------------------------------------------
      # VERIFY
      # ---------------------------------------------------------

      - name: Verify app
        working-directory: edge-main
        run: |
          echo "Checking generated application..."

          ls -lah build/ios/iphoneos/

          test -d build/ios/iphoneos/Runner.app

          echo "======================================"
          echo "RUNNER.APP FOUND"
          echo "======================================"

      # ---------------------------------------------------------
      # CREATE UNSIGNED IPA
      # ---------------------------------------------------------

      - name: Create IPA
        working-directory: edge-main
        run: |
          echo "Creating unsigned IPA..."

          rm -rf Payload
          mkdir -p Payload

          cp -R build/ios/iphoneos/Runner.app Payload/Runner.app

          zip -qr -y \
            openstrap-edge-custom-unsigned.ipa \
            Payload

          echo "======================================"
          echo "IPA CREATED"
          echo "======================================"

          ls -lh openstrap-edge-custom-unsigned.ipa

      # ---------------------------------------------------------
      # UPLOAD IPA
      # ---------------------------------------------------------

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: openstrap-edge-custom-unsigned-ipa
          path: edge-main/openstrap-edge-custom-unsigned.ipa
