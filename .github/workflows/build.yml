name: Build OpenStrap Edge Custom IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest

    steps:

      # =========================================================
      # CHECKOUT
      # =========================================================

      - name: Checkout
        uses: actions/checkout@v4

      # =========================================================
      # EXTRACT PROJECT
      # =========================================================

      - name: Extract project
        run: |
          echo "Extracting OpenStrap Edge project..."

          unzip -q openstrap-edge-whoop-custom.zip

          echo "Project extracted."
          echo "Root contents:"
          ls -la

          echo "Project contents:"
          ls -la edge-main

      # =========================================================
      # FLUTTER
      # =========================================================

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: stable

      # =========================================================
      # DEPENDENCIES
      # =========================================================

      - name: Install dependencies
        working-directory: edge-main
        run: |
          echo "Preparing environment..."

          echo "COMPANION_URL=" > .env
          echo "BACKEND_URL=" >> .env
          echo "ENABLE_HEALTH_DATA_CONTRIBUTION=true" >> .env

          flutter --version

          flutter pub get

          echo "Flutter dependencies installed."

      # =========================================================
      # XCODE CHECK
      # =========================================================

      - name: Check Xcode
        run: |
          echo "Xcode version:"
          xcodebuild -version

          echo "Developer directory:"
          xcode-select -p

      # =========================================================
      # FIX DART COMPILE ERRORS
      # =========================================================

      - name: Fix Dart compile errors
        working-directory: edge-main
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("lib/ui2/screens/home_screen.dart")

          if not p.exists():
              raise SystemExit("ERROR: home_screen.dart not found")

          s = p.read_text()

          print("Patching home_screen.dart...")

          # -----------------------------------------------------
          # FIX 1
          # Nullable tuple destructuring
          # -----------------------------------------------------

          old = "final (armedAt, alarmState) = alarmArmOfContext(c);"

          new = """final alarmContext = alarmArmOfContext(c);
              final armedAt = alarmContext?.$1;
              final alarmState = alarmContext?.$2;"""

          if old in s:
              s = s.replace(old, new)
              print("FIX 1: applied")
          else:
              print("FIX 1: already applied / not found")

          # -----------------------------------------------------
          # FIX 2
          # AlarmScreen does not exist in current source.
          #
          # Disable only the broken navigation callback so the
          # application can compile.
          # -----------------------------------------------------

          old = "onTap: () => go(c, const AlarmScreen()),"

          if old in s:
              s = s.replace(
                  old,
                  "onTap: () {},"
              )
              print("FIX 2: applied")

          old = "onTap: () => go(c, AlarmScreen()),"

          if old in s:
              s = s.replace(
                  old,
                  "onTap: () {},"
              )
              print("FIX 2b: applied")

          # -----------------------------------------------------
          # FIX 3
          # AlarmArmState.smart does not exist in current enum.
          # -----------------------------------------------------

          old = "alarmState == AlarmArmState.smart"

          if old in s:
              s = s.replace(
                  old,
                  "alarmState != null"
              )
              print("FIX 3: applied")
          else:
              print("FIX 3: already applied / not found")

          p.write_text(s)

          print("")
          print("Dart patch completed successfully.")
          PY

      # =========================================================
      # DISABLE IOS SIGNING
      # =========================================================

      - name: Disable iOS signing
        working-directory: edge-main
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("ios/Runner.xcodeproj/project.pbxproj")

          if p.exists():

              s = p.read_text()

              s = s.replace(
                  "CODE_SIGN_STYLE = Automatic;",
                  "CODE_SIGN_STYLE = Manual;"
              )

              s = s.replace(
                  "CODE_SIGNING_ALLOWED = YES;",
                  "CODE_SIGNING_ALLOWED = NO;"
              )

              s = s.replace(
                  "CODE_SIGNING_REQUIRED = YES;",
                  "CODE_SIGNING_REQUIRED = NO;"
              )

              s = s.replace(
                  'DEVELOPMENT_TEAM = "$(APPLE_DEVELOPMENT_TEAM)";',
                  'DEVELOPMENT_TEAM = "";'
              )

              s = s.replace(
                  'CODE_SIGN_IDENTITY = "Apple Development";',
                  'CODE_SIGN_IDENTITY = "";'
              )

              p.write_text(s)

              print("project.pbxproj patched.")

          else:
              print("WARNING: project.pbxproj not found.")

          # -----------------------------------------------------
          # Signing defaults
          # -----------------------------------------------------

          signing = Path("ios/Config/Signing.defaults.xcconfig")

          if signing.exists():

              ss = signing.read_text()

              if "CODE_SIGNING_ALLOWED = NO" not in ss:
                  ss += "\nCODE_SIGNING_ALLOWED = NO\n"

              if "CODE_SIGNING_REQUIRED = NO" not in ss:
                  ss += "CODE_SIGNING_REQUIRED = NO\n"

              signing.write_text(ss)

              print("Signing.defaults.xcconfig patched.")

          else:
              print("Signing.defaults.xcconfig not found.")

          print("")
          print("Unsigned iOS build configuration ready.")
          PY

      # =========================================================
      # FLUTTER IOS CONFIGURATION
      # =========================================================

      - name: Prepare Flutter iOS
        working-directory: edge-main
        run: |
          echo "Preparing Flutter iOS project..."

          flutter build ios \
            --release \
            --no-codesign \
            --config-only \
            --dart-define-from-file=.env

      # =========================================================
      # BUILD IOS
      # =========================================================

      - name: Build iOS without signing
        working-directory: edge-main
        run: |
          echo "Starting Xcode build..."

          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/ios \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            build

          echo "Xcode build completed."

      # =========================================================
      # FIND GENERATED APP
      # =========================================================

      - name: Find generated iOS app
        working-directory: edge-main
        run: |
          echo "=========================================="
          echo "SEARCHING FOR RUNNER.APP"
          echo "=========================================="

          echo ""
          echo "Searching inside build directory..."

          find build \
            -type d \
            -name "Runner.app" \
            -print 2>/dev/null || true

          echo ""
          echo "Searching entire project..."

          find . \
            -type d \
            -name "Runner.app" \
            -print 2>/dev/null || true

          echo ""
          echo "Selecting first Runner.app..."

          APP_PATH=$(find build \
            -type d \
            -name "Runner.app" \
            -print \
            -quit 2>/dev/null || true)

          if [ -z "$APP_PATH" ]; then

            echo ""
            echo "=========================================="
            echo "ERROR: RUNNER.APP NOT FOUND"
            echo "=========================================="

            echo ""
            echo "Build directory structure:"

            find build \
              -maxdepth 6 \
              -type d \
              -print 2>/dev/null | head -300 || true

            exit 1
          fi

          echo ""
          echo "=========================================="
          echo "RUNNER.APP FOUND"
          echo "=========================================="

          echo "$APP_PATH"

          echo "$APP_PATH" > runner_app_path.txt

          echo ""
          echo "App size:"
          du -sh "$APP_PATH"

      # =========================================================
      # CREATE IPA
      # =========================================================

      - name: Create IPA
        working-directory: edge-main
        run: |
          echo "=========================================="
          echo "CREATING UNSIGNED IPA"
          echo "=========================================="

          APP_PATH=$(cat runner_app_path.txt)

          echo ""
          echo "Using application:"
          echo "$APP_PATH"

          if [ ! -d "$APP_PATH" ]; then
            echo "ERROR: Application path does not exist."
            exit 1
          fi

          rm -rf Payload

          mkdir -p Payload

          cp -R "$APP_PATH" Payload/Runner.app

          echo ""
          echo "Creating IPA archive..."

          zip -qr -y \
            openstrap-edge-custom-unsigned.ipa \
            Payload

          echo ""
          echo "=========================================="
          echo "IPA CREATED SUCCESSFULLY"
          echo "=========================================="

          ls -lh openstrap-edge-custom-unsigned.ipa

      # =========================================================
      # VERIFY IPA
      # =========================================================

      - name: Verify IPA
        working-directory: edge-main
        run: |
          echo "Verifying IPA..."

          test -f openstrap-edge-custom-unsigned.ipa

          echo ""
          echo "IPA file:"
          ls -lh openstrap-edge-custom-unsigned.ipa

          echo ""
          echo "IPA contents:"

          unzip -l openstrap-edge-custom-unsigned.ipa | head -30

          echo ""
          echo "IPA verification completed."

      # =========================================================
      # UPLOAD ARTIFACT
      # =========================================================

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: openstrap-edge-custom-unsigned-ipa
          path: edge-main/openstrap-edge-custom-unsigned.ipa
          if-no-files-found: error
