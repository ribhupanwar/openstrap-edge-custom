name: Build OpenStrap Edge Custom IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          unzip -q openstrap-edge-whoop-custom.zip
          echo "Project extracted"
          ls -la

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'

      - name: Install dependencies
        working-directory: edge-main
        run: |
          echo "COMPANION_URL=" > .env
          echo "BACKEND_URL=" >> .env
          echo "ENABLE_HEALTH_DATA_CONTRIBUTION=true" >> .env
          flutter pub get

      - name: Check Xcode
        run: |
          xcodebuild -version
          xcode-select -p

      - name: Disable iOS signing
        working-directory: edge-main
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("ios/Runner.xcodeproj/project.pbxproj")
          s = p.read_text()

          s = s.replace(
              'CODE_SIGN_STYLE = Automatic;',
              'CODE_SIGN_STYLE = Manual;'
          )

          s = s.replace(
              'CODE_SIGNING_ALLOWED = YES;',
              'CODE_SIGNING_ALLOWED = NO;'
          )

          s = s.replace(
              'CODE_SIGNING_REQUIRED = YES;',
              'CODE_SIGNING_REQUIRED = NO;'
          )

          s = s.replace(
              'DEVELOPMENT_TEAM = "$(APPLE_DEVELOPMENT_TEAM)";',
              'DEVELOPMENT_TEAM = "";'
          )

          s = s.replace(
              'CODE_SIGN_IDENTITY = "Apple Development";',
              'CODE_SIGN_IDENTITY = "";'
          )

          p.write_text(s)

          signing = Path("ios/Config/Signing.defaults.xcconfig")

          if signing.exists():
              ss = signing.read_text()
              ss += "\nCODE_SIGNING_ALLOWED = NO\n"
              ss += "CODE_SIGNING_REQUIRED = NO\n"
              signing.write_text(ss)

          print("Signing configuration modified.")
          PY

      - name: Prepare Flutter iOS
        working-directory: edge-main
        run: |
          flutter build ios \
            --release \
            --no-codesign \
            --config-only \
            --dart-define-from-file=.env

      - name: Build iOS without signing
        working-directory: edge-main
        run: |
          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/ios \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            build

      - name: Verify app
        working-directory: edge-main
        run: |
          ls -lah build/ios/iphoneos/
          test -d build/ios/iphoneos/Runner.app
          echo "RUNNER.APP FOUND"

      - name: Create IPA
        working-directory: edge-main
        run: |
          rm -rf Payload
          mkdir -p Payload

          cp -R build/ios/iphoneos/Runner.app Payload/Runner.app

          zip -qr -y openstrap-edge-custom-unsigned.ipa Payload

          ls -lh openstrap-edge-custom-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: openstrap-edge-custom-unsigned-ipa
          path: edge-main/openstrap-edge-custom-unsigned.ipa
