name: Build OpenStrap Edge Custom IPA WITH WATCH

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout
        uses: actions/checkout@v4


      # ============================================================
      # 2. EXTRACT CUSTOM PROJECT
      # ============================================================

      - name: Extract project
        run: |
          echo "=========================================="
          echo "EXTRACTING OPENSTRAP EDGE PROJECT"
          echo "=========================================="

          unzip -q openstrap-edge-whoop-custom.zip

          echo ""
          echo "Root:"
          ls -la

          echo ""
          echo "Project:"
          ls -la edge-main

          echo ""
          echo "Watch source:"
          find "edge-main/ios/OpenStrapWatch Watch App" \
            -maxdepth 2 \
            -type f \
            -print || true


      # ============================================================
      # 3. FLUTTER
      # ============================================================

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: stable


      # ============================================================
      # 4. DEPENDENCIES
      # ============================================================

      - name: Install dependencies
        working-directory: edge-main
        run: |
          echo "=========================================="
          echo "INSTALLING FLUTTER DEPENDENCIES"
          echo "=========================================="

          echo "COMPANION_URL=" > .env
          echo "BACKEND_URL=" >> .env
          echo "ENABLE_HEALTH_DATA_CONTRIBUTION=true" >> .env

          flutter --version
          flutter pub get


      # ============================================================
      # 5. XCODE CHECK
      # ============================================================

      - name: Check Xcode
        run: |
          echo "=========================================="
          echo "XCODE"
          echo "=========================================="

          xcodebuild -version
          xcode-select -p


      # ============================================================
      # 6. FIX DART COMPILATION
      # ============================================================

      - name: Fix Dart compile errors
        working-directory: edge-main
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("lib/ui2/screens/home_screen.dart")

          if not p.exists():
              raise SystemExit("ERROR: home_screen.dart not found")

          s = p.read_text()

          print("Patching home_screen.dart...")

          # --------------------------------------------------------
          # FIX nullable tuple
          # --------------------------------------------------------

          old = "final (armedAt, alarmState) = alarmArmOfContext(c);"

          new = """final alarmContext = alarmArmOfContext(c);
              final armedAt = alarmContext?.$1;
              final alarmState = alarmContext?.$2;"""

          if old in s:
              s = s.replace(old, new)
              print("FIX 1 applied")
          else:
              print("FIX 1 already applied / not found")

          # --------------------------------------------------------
          # FIX missing AlarmScreen
          # --------------------------------------------------------

          old = "onTap: () => go(c, const AlarmScreen()),"

          if old in s:
              s = s.replace(old, "onTap: () {},")
              print("FIX 2 applied")

          old = "onTap: () => go(c, AlarmScreen()),"

          if old in s:
              s = s.replace(old, "onTap: () {},")
              print("FIX 2b applied")

          # --------------------------------------------------------
          # FIX missing AlarmArmState.smart
          # --------------------------------------------------------

          old = "alarmState == AlarmArmState.smart"

          if old in s:
              s = s.replace(old, "alarmState != null")
              print("FIX 3 applied")
          else:
              print("FIX 3 already applied / not found")

          p.write_text(s)

          print("Dart patch completed.")
          PY


      # ============================================================
      # 7. PREPARE WATCH SIGNING
      #
      # IMPORTANT:
      # WATCH IS NOT REMOVED.
      #
      # We only disable Apple's development signing in CI.
      # Sideloadly will perform the actual device signing later.
      # ============================================================

      - name: Prepare iOS and Watch signing
        working-directory: edge-main
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("ios/Runner.xcodeproj/project.pbxproj")

          if not p.exists():
              raise SystemExit("ERROR: project.pbxproj not found")

          s = p.read_text()

          print("Patching iOS signing...")

          # --------------------------------------------------------
          # MAIN PROJECT / IOS TARGET
          # --------------------------------------------------------

          s = s.replace(
              "CODE_SIGN_STYLE = Automatic;",
              "CODE_SIGN_STYLE = Manual;"
          )

          s = s.replace(
              "CODE_SIGNING_ALLOWED = YES;",
              "CODE_SIGNING_ALLOWED = NO;"
          )

          s = s.replace(
              "CODE_SIGNING_REQUIRED = YES;",
              "CODE_SIGNING_REQUIRED = NO;"
          )

          s = s.replace(
              'DEVELOPMENT_TEAM = "$(APPLE_DEVELOPMENT_TEAM)";',
              'DEVELOPMENT_TEAM = "";'
          )

          s = s.replace(
              'CODE_SIGN_IDENTITY = "Apple Development";',
              'CODE_SIGN_IDENTITY = "";'
          )

          # --------------------------------------------------------
          # WATCH TARGET
          #
          # Watch app doesn't actually use App Groups in its Swift
          # code. Removing its CI entitlement prevents a provisioning
          # profile/App Group requirement from interfering with the
          # later Sideloadly signing.
          # --------------------------------------------------------

          watch_entitlement = (
              'CODE_SIGN_ENTITLEMENTS = '
              '"OpenStrapWatch Watch App/OpenStrapWatch Watch App.entitlements";'
          )

          if watch_entitlement in s:
              s = s.replace(
                  watch_entitlement,
                  'CODE_SIGN_ENTITLEMENTS = "";'
              )
              print("Watch App Group entitlement disabled for CI build.")
          else:
              print("Watch entitlement line not found.")

          p.write_text(s)

          # --------------------------------------------------------
          # Signing.defaults.xcconfig
          # --------------------------------------------------------

          signing = Path("ios/Config/Signing.defaults.xcconfig")

          if signing.exists():

              ss = signing.read_text()

              if "CODE_SIGNING_ALLOWED = NO" not in ss:
                  ss += "\nCODE_SIGNING_ALLOWED = NO\n"

              if "CODE_SIGNING_REQUIRED = NO" not in ss:
                  ss += "CODE_SIGNING_REQUIRED = NO\n"

              signing.write_text(ss)

              print("Signing.defaults.xcconfig patched.")

          print("")
          print("==========================================")
          print("WATCH TARGET WILL BE BUILT")
          print("WATCH TARGET WILL NOT BE REMOVED")
          print("==========================================")
          PY


      # ============================================================
      # 8. VERIFY WATCH CONFIGURATION BEFORE BUILD
      # ============================================================

      - name: Verify Watch configuration
        working-directory: edge-main
        run: |
          echo "=========================================="
          echo "WATCH CONFIGURATION"
          echo "=========================================="

          echo ""
          echo "Watch target:"
          grep -n \
            'OpenStrapWatch Watch App' \
            ios/Runner.xcodeproj/project.pbxproj \
            | head -30 || true

          echo ""
          echo "Watch bundle ID:"
          grep -n \
            'PRODUCT_BUNDLE_IDENTIFIER = "$(APP_BUNDLE_IDENTIFIER).watchkitapp"' \
            ios/Runner.xcodeproj/project.pbxproj \
            || true

          echo ""
          echo "Watch companion ID:"
          grep -n \
            'INFOPLIST_KEY_WKCompanionAppBundleIdentifier = "$(APP_BUNDLE_IDENTIFIER)"' \
            ios/Runner.xcodeproj/project.pbxproj \
            || true

          echo ""
          echo "Watch embedding:"
          grep -n \
            'Embed Watch Content' \
            ios/Runner.xcodeproj/project.pbxproj \
            || true

          echo ""
          echo "Expected relationship:"
          echo "iPhone  = com.example.openstrapEdge"
          echo "Watch   = com.example.openstrapEdge.watchkitapp"


      # ============================================================
      # 9. PREPARE FLUTTER IOS
      # ============================================================

      - name: Prepare Flutter iOS
        working-directory: edge-main
        run: |
          echo "=========================================="
          echo "FLUTTER IOS PREPARATION"
          echo "=========================================="

          flutter build ios \
            --release \
            --no-codesign \
            --config-only \
            --dart-define-from-file=.env


      # ============================================================
      # 10. BUILD IOS + WATCH
      # ============================================================

      - name: Build iOS and Watch without Apple signing
        working-directory: edge-main
        run: |
          echo "=========================================="
          echo "BUILDING IOS + WATCH"
          echo "=========================================="

          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/ios \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            build

          echo ""
          echo "=========================================="
          echo "XCODE BUILD COMPLETED"
          echo "=========================================="


      # ============================================================
      # 11. FIND RUNNER.APP
      # ============================================================

      - name: Find generated iOS app
        working-directory: edge-main
        run: |
          echo "=========================================="
          echo "SEARCHING FOR RUNNER.APP"
          echo "=========================================="

          find build \
            -type d \
            -name "Runner.app" \
            -print 2>/dev/null || true

          APP_PATH=$(find build \
            -type d \
            -name "Runner.app" \
            -print \
            -quit 2>/dev/null || true)

          if [ -z "$APP_PATH" ]; then
            echo ""
            echo "ERROR: Runner.app was not generated."
            exit 1
          fi

          echo ""
          echo "RUNNER.APP:"
          echo "$APP_PATH"

          echo "$APP_PATH" > runner_app_path.txt

          echo ""
          echo "SIZE:"
          du -sh "$APP_PATH"


      # ============================================================
      # 12. VERIFY WATCH WAS ACTUALLY EMBEDDED
      # ============================================================

      - name: Verify embedded Watch app
        working-directory: edge-main
        run: |
          APP_PATH=$(cat runner_app_path.txt)

          WATCH_APP="$APP_PATH/Watch/OpenStrapWatch Watch App.app"

          echo "=========================================="
          echo "VERIFYING WATCH APP"
          echo "=========================================="

          echo ""
          echo "Runner:"
          echo "$APP_PATH"

          echo ""
          echo "Expected Watch:"
          echo "$WATCH_APP"

          if [ ! -d "$WATCH_APP" ]; then
            echo ""
            echo "ERROR: Watch app was NOT embedded."
            echo ""
            echo "Runner contents:"
            find "$APP_PATH" \
              -maxdepth 4 \
              -print | head -250
            exit 1
          fi

          echo ""
          echo "SUCCESS: Watch app exists."

          echo ""
          echo "Watch contents:"
          find "$WATCH_APP" \
            -maxdepth 3 \
            -print | head -200

          echo ""
          echo "Watch executable candidates:"
          find "$WATCH_APP" \
            -type f \
            -maxdepth 2 \
            -print


      # ============================================================
      # 13. INSPECT WATCH MACH-O
      # ============================================================

      - name: Inspect Watch Mach-O
        working-directory: edge-main
        run: |
          APP_PATH=$(cat runner_app_path.txt)

          WATCH_APP="$APP_PATH/Watch/OpenStrapWatch Watch App.app"

          echo "=========================================="
          echo "WATCH MACH-O INSPECTION"
          echo "=========================================="

          echo ""
          echo "Mach-O files:"

          find "$WATCH_APP" \
            -type f \
            -print0 | while IFS= read -r -d '' FILE
          do
            if file "$FILE" | grep -q "Mach-O"; then
              echo ""
              echo "------------------------------------------"
              echo "$FILE"
              file "$FILE" || true

              if command -v lipo >/dev/null 2>&1; then
                lipo -info "$FILE" 2>&1 || true
              fi

              codesign -dv "$FILE" 2>&1 | head -20 || true
            fi
          done


      # ============================================================
      # 14. AD-HOC SIGN WATCH MACH-O
      #
      # This is the important workaround for Sideloadly 0.70.1.
      #
      # We are NOT using an Apple Developer certificate here.
      # "-" means Apple's local ad-hoc signature.
      #
      # Sideloadly can later replace this signature with the
      # user's Apple ID signing.
      # ============================================================

      - name: Ad-hoc sign Watch content
        working-directory: edge-main
        run: |
          APP_PATH=$(cat runner_app_path.txt)

          WATCH_APP="$APP_PATH/Watch/OpenStrapWatch Watch App.app"

          echo "=========================================="
          echo "AD-HOC SIGNING WATCH CONTENT"
          echo "=========================================="

          if [ ! -d "$WATCH_APP" ]; then
            echo "ERROR: Watch app missing."
            exit 1
          fi

          echo ""
          echo "Signing nested Mach-O files first..."

          find "$WATCH_APP" \
            -type f \
            -print0 | while IFS= read -r -d '' FILE
          do

            if file "$FILE" | grep -q "Mach-O"; then

              echo ""
              echo "Signing:"
              echo "$FILE"

              codesign \
                --force \
                --sign - \
                --timestamp=none \
                "$FILE"

            fi

          done

          echo ""
          echo "Signing Watch application bundle..."

          codesign \
            --deep \
            --force \
            --sign - \
            --timestamp=none \
            "$WATCH_APP"

          echo ""
          echo "Watch signing completed."


      # ============================================================
      # 15. VERIFY WATCH SIGNATURE
      # ============================================================

      - name: Verify Watch signature
        working-directory: edge-main
        run: |
          APP_PATH=$(cat runner_app_path.txt)

          WATCH_APP="$APP_PATH/Watch/OpenStrapWatch Watch App.app"

          echo "=========================================="
          echo "VERIFYING WATCH SIGNATURE"
          echo "=========================================="

          echo ""
          echo "codesign verification:"

          codesign \
            --verify \
            --deep \
            --strict \
            "$WATCH_APP"

          echo ""
          echo "Watch signature:"
          codesign \
            -dv \
            --verbose=4 \
            "$WATCH_APP" \
            2>&1 | head -80 || true

          echo ""
          echo "Watch verification completed."


      # ============================================================
      # 16. VERIFY WATCH BUNDLE IDS
      # ============================================================

      - name: Verify Watch bundle identifiers
        working-directory: edge-main
        run: |
          APP_PATH=$(cat runner_app_path.txt)

          WATCH_APP="$APP_PATH/Watch/OpenStrapWatch Watch App.app"

          echo "=========================================="
          echo "WATCH BUNDLE IDENTIFIERS"
          echo "=========================================="

          echo ""
          echo "iPhone Info.plist:"
          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleIdentifier" \
            "$APP_PATH/Info.plist" \
            || true

          echo ""
          echo "Watch Info.plist:"
          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleIdentifier" \
            "$WATCH_APP/Info.plist" \
            || true

          echo ""
          echo "Watch companion:"
          /usr/libexec/PlistBuddy \
            -c "Print :WKCompanionAppBundleIdentifier" \
            "$WATCH_APP/Info.plist" \
            || true

          echo ""
          echo "Expected:"
          echo "Watch ID must end in:"
          echo ".watchkitapp"

          echo ""
          echo "Companion must equal iPhone bundle ID."


      # ============================================================
      # 17. CREATE IPA
      # ============================================================

      - name: Create IPA with Watch
        working-directory: edge-main
        run: |
          echo "=========================================="
          echo "CREATING IPA WITH WATCH"
          echo "=========================================="

          APP_PATH=$(cat runner_app_path.txt)

          if [ ! -d "$APP_PATH" ]; then
            echo "ERROR: Runner.app does not exist."
            exit 1
          fi

          rm -rf Payload
          mkdir -p Payload

          cp -R "$APP_PATH" Payload/Runner.app

          echo ""
          echo "Checking Payload/Runner.app/Watch..."

          if [ ! -d "Payload/Runner.app/Watch" ]; then
            echo "ERROR: Watch directory missing from payload."
            exit 1
          fi

          if [ ! -d \
            "Payload/Runner.app/Watch/OpenStrapWatch Watch App.app" ]; then
            echo "ERROR: OpenStrap Watch app missing from payload."
            exit 1
          fi

          echo ""
          echo "Watch payload confirmed."

          echo ""
          echo "Creating IPA..."

          rm -f openstrap-edge-custom-watch-unsigned.ipa

          zip \
            -qr \
            -y \
            openstrap-edge-custom-watch-unsigned.ipa \
            Payload

          echo ""
          echo "=========================================="
          echo "IPA CREATED"
          echo "=========================================="

          ls -lh openstrap-edge-custom-watch-unsigned.ipa


      # ============================================================
      # 18. VERIFY IPA
      # ============================================================

      - name: Verify IPA contains Watch
        working-directory: edge-main
        run: |
          IPA="openstrap-edge-custom-watch-unsigned.ipa"

          echo "=========================================="
          echo "FINAL IPA VERIFICATION"
          echo "=========================================="

          test -f "$IPA"

          echo ""
          echo "IPA:"
          ls -lh "$IPA"

          echo ""
          echo "Watch entries:"

          unzip -l "$IPA" \
            | grep -i \
              "OpenStrapWatch" \
            | head -100

          echo ""
          echo "Checking Watch app..."

          if unzip -l "$IPA" \
            | grep -q \
              "Payload/Runner.app/Watch/OpenStrapWatch Watch App.app/"; then

            echo ""
            echo "SUCCESS:"
            echo "Watch app IS INSIDE IPA."

          else

            echo ""
            echo "ERROR:"
            echo "Watch app is NOT inside IPA."
            exit 1

          fi

          echo ""
          echo "Checking that Watch was not accidentally removed..."

          if unzip -l "$IPA" \
            | grep -qi "Payload/Runner.app/Watch/"; then

            echo "SUCCESS: Watch directory exists."

          else

            echo "ERROR: Watch directory missing."
            exit 1

          fi

          echo ""
          echo "=========================================="
          echo "WATCH IPA READY"
          echo "=========================================="


      # ============================================================
      # 19. UPLOAD IPA
      # ============================================================

      - name: Upload Watch IPA
        uses: actions/upload-artifact@v4
        with:
          name: openstrap-edge-custom-watch-unsigned-ipa
          path: edge-main/openstrap-edge-custom-watch-unsigned.ipa
          if-no-files-found: error
