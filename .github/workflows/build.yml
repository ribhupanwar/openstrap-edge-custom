name: Build OpenStrap Edge Custom IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          unzip -q openstrap-edge-whoop-custom.zip
          echo "Project extracted"
          ls -la edge-main

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'

      - name: Install dependencies
        working-directory: edge-main
        run: |
          echo "COMPANION_URL=" > .env
          echo "BACKEND_URL=" >> .env
          echo "ENABLE_HEALTH_DATA_CONTRIBUTION=true" >> .env
          flutter pub get

      - name: Disable ALL iOS signing
        working-directory: edge-main
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("ios/Runner.xcodeproj/project.pbxproj")
          s = p.read_text()

          s = s.replace(
              "CODE_SIGNING_ALLOWED = YES;",
              "CODE_SIGNING_ALLOWED = NO;"
          )

          s = s.replace(
              "CODE_SIGNING_REQUIRED = YES;",
              "CODE_SIGNING_REQUIRED = NO;"
          )

          s = s.replace(
              "CODE_SIGN_STYLE = Automatic;",
              "CODE_SIGN_STYLE = Manual;"
          )

          lines = []

          for line in s.splitlines():
              if "DEVELOPMENT_TEAM =" in line:
                  continue

              if "PROVISIONING_PROFILE_SPECIFIER =" in line:
                  continue

              lines.append(line)

          p.write_text("\n".join(lines) + "\n")
          PY

          echo "===== SIGNING SETTINGS ====="
          grep -nE \
            "CODE_SIGN|DEVELOPMENT_TEAM|PROVISIONING_PROFILE" \
            ios/Runner.xcodeproj/project.pbxproj || true

      - name: Build iOS
        working-directory: edge-main
        run: |
          flutter build ios \
            --release \
            --no-codesign \
            --dart-define-from-file=.env

      - name: Package IPA
        working-directory: edge-main
        run: |
          rm -rf Payload
          mkdir -p Payload

          cp -R \
            build/ios/iphoneos/Runner.app \
            Payload/Runner.app

          zip -qr -y \
            openstrap-edge-custom-unsigned.ipa \
            Payload

          ls -lh openstrap-edge-custom-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: openstrap-edge-custom-unsigned-ipa
          path: edge-main/openstrap-edge-custom-unsigned.ipa
