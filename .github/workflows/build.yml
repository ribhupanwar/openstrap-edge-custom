name: Build OpenStrap Edge Custom IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest

    steps:

      # =========================================================
      # CHECKOUT
      # =========================================================

      - name: Checkout
        uses: actions/checkout@v4

      # =========================================================
      # EXTRACT PROJECT
      # =========================================================

      - name: Extract project
        run: |
          echo "Extracting OpenStrap Edge project..."

          unzip -q openstrap-edge-whoop-custom.zip

          echo "Project extracted."
          ls -la
          ls -la edge-main

      # =========================================================
      # FLUTTER
      # =========================================================

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: stable

      # =========================================================
      # DEPENDENCIES
      # =========================================================

      - name: Install dependencies
        working-directory: edge-main
        run: |
          echo "COMPANION_URL=" > .env
          echo "BACKEND_URL=" >> .env
          echo "ENABLE_HEALTH_DATA_CONTRIBUTION=true" >> .env

          flutter --version
          flutter pub get

      # =========================================================
      # XCODE CHECK
      # =========================================================

      - name: Check Xcode
        run: |
          xcodebuild -version
          xcode-select -p

      # =========================================================
      # FIX DART COMPILE ERRORS
      # =========================================================

      - name: Fix Dart compile errors
        working-directory: edge-main
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("lib/ui2/screens/home_screen.dart")

          if not p.exists():
              raise SystemExit("ERROR: home_screen.dart not found")

          s = p.read_text()

          print("Patching home_screen.dart...")

          # -----------------------------------------------------
          # FIX 1
          # Nullable tuple destructuring
          # -----------------------------------------------------

          old = "final (armedAt, alarmState) = alarmArmOfContext(c);"

          new = """final alarmContext = alarmArmOfContext(c);
              final armedAt = alarmContext?.$1;
              final alarmState = alarmContext?.$2;"""

          if old in s:
              s = s.replace(old, new)
              print("FIX 1 applied")
          else:
              print("FIX 1 already applied / not found")

          # -----------------------------------------------------
          # FIX 2
          # AlarmScreen does not exist in current source.
          # -----------------------------------------------------

          old = "onTap: () => go(c, const AlarmScreen()),"

          if old in s:
              s = s.replace(
                  old,
                  "onTap: () {},"
              )
              print("FIX 2 applied")

          old = "onTap: () => go(c, AlarmScreen()),"

          if old in s:
              s = s.replace(
                  old,
                  "onTap: () {},"
              )
              print("FIX 2b applied")

          # -----------------------------------------------------
          # FIX 3
          # AlarmArmState.smart does not exist
          # -----------------------------------------------------

          old = "alarmState == AlarmArmState.smart"

          if old in s:
              s = s.replace(
                  old,
                  "alarmState != null"
              )
              print("FIX 3 applied")
          else:
              print("FIX 3 already applied / not found")

          p.write_text(s)

          print("Dart patch completed.")
          PY

      # =========================================================
      # DISABLE IOS SIGNING
      # =========================================================

      - name: Disable iOS signing
        working-directory: edge-main
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("ios/Runner.xcodeproj/project.pbxproj")

          if p.exists():

              s = p.read_text()

              s = s.replace(
                  "CODE_SIGN_STYLE = Automatic;",
                  "CODE_SIGN_STYLE = Manual;"
              )

              s = s.replace(
                  "CODE_SIGNING_ALLOWED = YES;",
                  "CODE_SIGNING_ALLOWED = NO;"
              )

              s = s.replace(
                  "CODE_SIGNING_REQUIRED = YES;",
                  "CODE_SIGNING_REQUIRED = NO;"
              )

              s = s.replace(
                  'DEVELOPMENT_TEAM = "$(APPLE_DEVELOPMENT_TEAM)";',
                  'DEVELOPMENT_TEAM = "";'
              )

              s = s.replace(
                  'CODE_SIGN_IDENTITY = "Apple Development";',
                  'CODE_SIGN_IDENTITY = "";'
              )

              p.write_text(s)

              print("project.pbxproj patched.")

          signing = Path("ios/Config/Signing.defaults.xcconfig")

          if signing.exists():

              ss = signing.read_text()

              if "CODE_SIGNING_ALLOWED = NO" not in ss:
                  ss += "\nCODE_SIGNING_ALLOWED = NO\n"

              if "CODE_SIGNING_REQUIRED = NO" not in ss:
                  ss += "CODE_SIGNING_REQUIRED = NO\n"

              signing.write_text(ss)

              print("Signing.defaults.xcconfig patched.")

          print("Unsigned iOS build configuration ready.")
          PY

      # =========================================================
      # PREPARE FLUTTER IOS
      # =========================================================

      - name: Prepare Flutter iOS
        working-directory: edge-main
        run: |
          flutter build ios \
            --release \
            --no-codesign \
            --config-only \
            --dart-define-from-file=.env

      # =========================================================
      # BUILD IOS
      # =========================================================

      - name: Build iOS without signing
        working-directory: edge-main
        run: |
          echo "Starting Xcode build..."

          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/ios \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            build

          echo "Xcode build completed."

      # =========================================================
      # FIND RUNNER.APP
      # =========================================================

      - name: Find generated iOS app
        working-directory: edge-main
        run: |
          echo "Searching for Runner.app..."

          find build \
            -type d \
            -name "Runner.app" \
            -print 2>/dev/null || true

          APP_PATH=$(find build \
            -type d \
            -name "Runner.app" \
            -print \
            -quit 2>/dev/null || true)

          if [ -z "$APP_PATH" ]; then

            echo "ERROR: Runner.app was not generated."

            echo "Build directory:"
            find build \
              -maxdepth 6 \
              -type d \
              -print 2>/dev/null | head -300 || true

            exit 1
          fi

          echo "=========================================="
          echo "RUNNER.APP FOUND"
          echo "=========================================="

          echo "$APP_PATH"

          echo "$APP_PATH" > runner_app_path.txt

          du -sh "$APP_PATH"

      # =========================================================
      # REMOVE WATCH COMPANION FROM GENERATED IPA
      # =========================================================

      - name: Remove Watch companion
        working-directory: edge-main
        run: |
          APP_PATH=$(cat runner_app_path.txt)

          echo "=========================================="
          echo "CHECKING WATCH COMPANION"
          echo "=========================================="

          echo "Application:"
          echo "$APP_PATH"

          if [ -d "$APP_PATH/Watch" ]; then

            echo ""
            echo "Watch directory found:"
            find "$APP_PATH/Watch" \
              -maxdepth 3 \
              -print || true

            echo ""
            echo "Removing embedded Watch application..."

            rm -rf "$APP_PATH/Watch"

            echo ""
            echo "Watch companion removed."

          else

            echo ""
            echo "No Watch directory found."

          fi

          # -----------------------------------------------------
          # Also check for WatchKit/Watch extension locations
          # -----------------------------------------------------

          if [ -d "$APP_PATH/PlugIns" ]; then

            echo ""
            echo "Checking PlugIns..."

            find "$APP_PATH/PlugIns" \
              -maxdepth 3 \
              -print || true

            # Remove WatchKit extensions if present
            find "$APP_PATH/PlugIns" \
              -type d \
              \( -name "*.appex" -o -name "*Watch*" \) \
              -print 2>/dev/null || true

          fi

          echo ""
          echo "Final embedded bundles:"

          find "$APP_PATH" \
            -maxdepth 3 \
            -type d \
            \( -name "*.app" -o -name "*.appex" \) \
            -print 2>/dev/null || true

      # =========================================================
      # CREATE IPA
      # =========================================================

      - name: Create IPA
        working-directory: edge-main
        run: |
          echo "=========================================="
          echo "CREATING IPHONE-ONLY IPA"
          echo "=========================================="

          APP_PATH=$(cat runner_app_path.txt)

          if [ ! -d "$APP_PATH" ]; then
            echo "ERROR: Runner.app does not exist."
            exit 1
          fi

          echo "Using:"
          echo "$APP_PATH"

          rm -rf Payload
          mkdir -p Payload

          cp -R "$APP_PATH" Payload/Runner.app

          echo ""
          echo "Checking IPA payload..."

          find Payload \
            -maxdepth 4 \
            -type d \
            -print | head -100

          echo ""
          echo "Creating IPA..."

          zip -qr -y \
            openstrap-edge-custom-iphone-only-unsigned.ipa \
            Payload

          echo ""
          echo "=========================================="
          echo "IPA CREATED"
          echo "=========================================="

          ls -lh openstrap-edge-custom-iphone-only-unsigned.ipa

      # =========================================================
      # VERIFY IPA
      # =========================================================

      - name: Verify IPA
        working-directory: edge-main
        run: |
          echo "Verifying IPA..."

          test -f openstrap-edge-custom-iphone-only-unsigned.ipa

          echo ""
          echo "IPA:"
          ls -lh openstrap-edge-custom-iphone-only-unsigned.ipa

          echo ""
          echo "IPA contents:"

          unzip -l \
            openstrap-edge-custom-iphone-only-unsigned.ipa \
            | head -80

          echo ""
          echo "Checking that Watch app is absent..."

          if unzip -l \
            openstrap-edge-custom-iphone-only-unsigned.ipa \
            | grep -qi "Watch/OpenStrapWatch"; then

            echo "ERROR: Watch app is still present."
            exit 1

          else

            echo "SUCCESS: Watch companion is NOT inside IPA."

          fi

          echo ""
          echo "IPA verification completed."

      # =========================================================
      # UPLOAD IPA
      # =========================================================

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: openstrap-edge-custom-iphone-only-unsigned-ipa
          path: edge-main/openstrap-edge-custom-iphone-only-unsigned.ipa
          if-no-files-found: error
